<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>{{TITLE}} · FlashPaste</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}[hidden],.hidden{display:none!important}body{margin:0;background:#f3f7f5;color:#192d2b;font:15px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1100px;margin:auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #dce6e3;padding:25px 0}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800;text-decoration:none;color:#192d2b}.mark{display:grid;place-items:center;width:40px;height:40px;background:#137566;color:white;border-radius:12px;font-size:22px}.caption{font-size:12px;color:#5f7471;font-weight:400;letter-spacing:1px;display:block}.nav-link,a{color:#137566;text-underline-offset:3px}.nav-link{font-size:13px}main{padding:36px 0}h1,h2,p{margin:0}h1{font-size:28px;line-height:1.4;letter-spacing:-.5px;overflow-wrap:anywhere}.eyebrow{color:#137566;font-size:12px;font-weight:650;letter-spacing:1px;margin-bottom:8px}.lead{color:#5f7471;font-size:14px;margin:12px 0 24px}.badge{display:inline-block;font-size:12px;color:#315c96;background:#eaf1fb;padding:3px 8px;border-radius:6px;margin-bottom:12px}.card{background:white;border:1px solid #dce6e3;border-radius:16px;padding:26px;box-shadow:0 3px 12px #17392e04}.content-card{margin-top:24px}iframe{display:block;width:100%;height:70vh;border:1px solid #dce6e3;border-radius:9px;background:white}pre{font:14px/1.9 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.narrow{max-width:540px;margin:7vh auto 3vh}.icon{width:46px;height:46px;display:grid;place-items:center;border-radius:13px;background:#e7f3ed;color:#137566;font-size:24px;font-weight:700;margin-bottom:20px}.warning{padding:13px 15px;border:1px solid #ead4ae;border-radius:9px;background:#fff8eb;color:#7b571e;font-size:13px;margin:20px 0}.secret{display:block;padding:16px;background:#f1f7f4;border:1px solid #cdded3;border-radius:9px;font:14px/1.9 ui-monospace,monospace;word-break:break-all;user-select:all;margin-bottom:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.button,button{font:600 14px/1.5 system-ui;display:inline-flex;align-items:center;justify-content:center;min-height:42px;border:1px solid #cdded3;border-radius:9px;padding:9px 15px;background:white;color:#192d2b;text-decoration:none;cursor:pointer}.primary{background:#137566;border-color:#137566;color:white}.button:hover,button:hover{filter:brightness(.96)}a:focus-visible,button:focus-visible{outline:3px solid #70bba9;outline-offset:3px}.hint{font-size:12px;color:#5f7471;margin-top:18px}.status{font-size:13px;color:#137566;margin-top:12px}.footer{padding:20px 0 30px;color:#5f7471;font-size:12px;text-align:center}.share-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.share-heading .button{flex-shrink:0}.share-note{color:#5f7471;font-size:12px;margin-top:8px}
    body.viewer-immersive{background:#fff;height:100vh;width:100vw;overflow:hidden;margin:0;padding:0}body.viewer-immersive .shell{max-width:100%;margin:0;padding:0;height:100vh;width:100vw;min-height:100vh;overflow:hidden;display:flex;flex-direction:column}body.viewer-immersive .site-header,body.viewer-immersive .footer{display:none}body.viewer-immersive main{padding:0;margin:0;flex:1;height:100%;width:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
    .compact-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;height:42px;min-height:42px;padding:0 16px;background:#fbfdfc;border-bottom:1px solid #dce6e3;color:#192d2b;flex-shrink:0;z-index:10;transition:transform .2s ease}
    .compact-bar-left{display:flex;align-items:center;gap:10px;min-width:0}.compact-brand{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:#137566;color:#fff;border-radius:7px;font-weight:800;font-size:14px;text-decoration:none;flex-shrink:0}.compact-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}.compact-badge{font-size:11px;color:#315c96;background:#eaf1fb;padding:2px 6px;border-radius:4px;flex-shrink:0}
    .compact-bar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}.compact-btn{font:600 12px/1 system-ui;display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 10px;border:1px solid #cdded3;border-radius:6px;background:white;color:#192d2b;text-decoration:none;cursor:pointer}.compact-btn:hover{background:#f0f6f3;border-color:#acc5bc}.compact-btn.quiet{border-color:transparent;background:transparent;color:#5f7471}.compact-btn.quiet:hover{background:#edf3f0;color:#192d2b}
    .top-trigger{position:absolute;top:0;left:0;right:0;height:12px;z-index:25;display:none}
    .viewer-container{flex:1;width:100%;height:calc(100% - 42px);position:relative;background:#fff}
    body.viewer-immersive iframe{width:100%;height:100%;border:none;border-radius:0;margin:0;padding:0;display:block}
    body.fullscreen-active .compact-bar{transform:translateY(-100%);position:absolute;top:0;left:0;right:0;box-shadow:0 4px 12px rgba(0,0,0,.08)}
    body.fullscreen-active .top-trigger{display:block}
    body.fullscreen-active .top-trigger:hover + .compact-bar,body.fullscreen-active .compact-bar:hover{transform:translateY(0)}
    body.fullscreen-active .viewer-container{height:100%}
    .viewer-loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:#5f7471;font-size:14px;z-index:5;margin:0}
    @media(max-width:540px){.shell{padding:0 16px}header{padding:18px 0}.brand{font-size:19px}.nav-link{font-size:12px}main{padding:24px 0}.card{padding:22px 18px}.narrow{margin:24px auto}h1{font-size:24px}.share-heading{flex-direction:column}.actions{flex-direction:column}.actions>*{width:100%}.content-card{padding:16px}iframe{height:65vh}.compact-title{max-width:32vw}.compact-badge{display:none}}
  </style>
</head>

</html>
