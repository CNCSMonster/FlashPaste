[package]
name = "flashpaste"
version = "0.1.0"
edition = "2021"
description = "Lightweight content sharing: public links, token ACLs, and burn-after-read."
license = "MIT"
repository = "https://github.com/CNCSMonster/FlashPaste"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "flashpaste"
path = "src/main.rs"

[dependencies]
# 本地版本依赖
axum = { version = "0.7", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
rusqlite = { version = "0.31", features = ["bundled", "backup"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
rand = { version = "0.8", optional = true }

# Workers 版本依赖
worker = { version = "0.8.7", features = ["d1"], optional = true }
worker-macros = { version = "0.8.7", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
futures-util = { version = "0.3", optional = true }

# 共享依赖
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
url = "2"

[features]
default = ["local"]
local = ["axum", "tokio", "rusqlite", "tower-http", "chrono", "rand"]
worker = ["dep:worker", "dep:worker-macros", "dep:getrandom", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:futures-util"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
